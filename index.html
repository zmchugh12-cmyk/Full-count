<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Full Count</title>

<meta name="theme-color" content="#04070C">
<meta name="description" content="Baseball umpire simulator — call balls and strikes from behind the plate.">

<!-- installed-app behaviour -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Full Count">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0; padding: 0;
    background: #04070C;
    overscroll-behavior: none;          /* no pull-to-refresh mid-pitch */
    -webkit-text-size-adjust: 100%;
    height: 100%;
  }
  body {
    /* keep the game clear of the notch and the home indicator */
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    overflow: hidden;
  }
  /* A tap-timing game must never zoom, select, or show a tap flash. */
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  body, canvas, button { user-select: none; -webkit-user-select: none; }

  /* The game sizes its screens with 100vh. In a standalone iOS window that
     ignores the safe-area padding above, so the bottom controls slide under
     the home indicator. Recompute against the real inset instead, and use
     dvh so the URL bar (when run in a browser tab) doesn't crop it either. */
  #root > div {
    min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important;
  }
  #root > div[style*="max-height"] {
    max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important;
  }

  #boot {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8A6B18; background: #04070C;
    font: 600 11px/1.6 ui-monospace, monospace; letter-spacing: 3px;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">WARMING UP</div>

<script>
/* ── Persistence ──────────────────────────────────────────────────────
   The game persists its leaderboard through window.storage, which only
   exists inside the Claude artifact sandbox; everywhere else it falls
   back to an in-memory list that dies with the tab. Providing the same
   async API over localStorage here means scores survive across sessions
   with zero changes to the game source. */
(function () {
  var PREFIX = "fullcount:";
  function ok(key, value) { return { key: key, value: value, shared: false }; }
  window.storage = {
    get: function (key) {
      return new Promise(function (res, rej) {
        try {
          var v = localStorage.getItem(PREFIX + key);
          if (v === null) rej(new Error("not found"));
          else res(ok(key, v));
        } catch (e) { rej(e); }
      });
    },
    set: function (key, value) {
      return new Promise(function (res, rej) {
        try { localStorage.setItem(PREFIX + key, value); res(ok(key, value)); }
        catch (e) { rej(e); }
      });
    },
    delete: function (key) {
      return new Promise(function (res) {
        try { localStorage.removeItem(PREFIX + key); } catch (e) {}
        res({ key: key, deleted: true, shared: false });
      });
    },
    list: function (prefix) {
      return new Promise(function (res) {
        var keys = [];
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(PREFIX) === 0) {
              var bare = k.slice(PREFIX.length);
              if (!prefix || bare.indexOf(prefix) === 0) keys.push(bare);
            }
          }
        } catch (e) {}
        res({ keys: keys, prefix: prefix, shared: false });
      });
    }
  };
})();

/* Audio needs a user gesture. Resume on the first touch anywhere, and
   again whenever the app comes back from the background. */
(function () {
  function kick() {
    try { if (window.Tone && window.Tone.start) window.Tone.start(); } catch (e) {}
  }
  ["touchend", "pointerdown", "keydown"].forEach(function (ev) {
    window.addEventListener(ev, kick, { once: false, passive: true });
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) kick();
  });
})();

/* Belt-and-braces against iOS double-tap zoom, which fires as a second
   tap inside 300ms and would otherwise eat a call. */
(function () {
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last <= 320) e.preventDefault();
    last = now;
  }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
})();
</script>

<script src="./tone-shim.js"></script>
<script src="./vendor.js"></script>
<script src="./app.js"></script>
<script>
(function () {
  var boot = document.getElementById("boot");
  function fail(msg) {
    if (boot) { boot.textContent = msg; boot.style.color = "#E03B3B"; }
  }
  try {
    var React = window.__vendor("react");
    var createRoot = window.__vendor("react-dom/client").createRoot;
    var Game = window.__Game;
    if (!Game) return fail("GAME FAILED TO LOAD");
    createRoot(document.getElementById("root")).render(React.createElement(Game));
    if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
  } catch (e) {
    fail("ERROR: " + e.message);
    console.error(e);
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (e) {
        console.warn("SW registration failed", e);
      });
    });
  }
})();
</script>
</body>
</html>
